---
# ---------- Prepare the Windows data disk: find it, initialize, partition, format ----------
- name: Prepare the Windows data disk
  hosts: win

  vars:
    data_drive_letter: E
    data_label: DATA

  tasks:
    # Read all disks, so the disk is chosen by what it is, not by a hardcoded number
    - name: Gather disk facts
      community.windows.win_disk_facts:

    # Every disk that is not the system disk is a candidate
    - name: List the non-system disks
      ansible.builtin.set_fact:
        data_disks: "{{ ansible_facts.disks | rejectattr('system_disk') | list }}"

    # Refuse to guess: in this lab there must be exactly one non-system disk
    - name: Stop unless there is exactly one data disk
      ansible.builtin.assert:
        that: data_disks | length == 1
        fail_msg: "Expected exactly 1 non-system disk, found {{ data_disks | length }}. Not touching anything."

    - name: Select the data disk
      ansible.builtin.set_fact:
        data_disk: "{{ data_disks | first }}"

    - name: Show which disk was selected
      ansible.builtin.debug:
        msg: "Data disk: number {{ data_disk.number }}, style {{ data_disk.partition_style }}"

    # Initialize only a RAW (uninitialized) disk. An initialized disk is never touched here
    - name: Initialize the disk as GPT
      community.windows.win_initialize_disk:
        disk_number: "{{ data_disk.number }}"
        style: gpt
      when: data_disk.partition_style == 'RAW'

    # Create one partition using the whole disk (-1 = maximum size), with a fixed drive letter
    - name: Create the partition
      community.windows.win_partition:
        disk_number: "{{ data_disk.number }}"
        drive_letter: "{{ data_drive_letter }}"
        partition_size: -1
        state: present

    # Format NTFS. Without "force" an existing filesystem is never overwritten
    - name: Format the partition
      community.windows.win_format:
        drive_letter: "{{ data_drive_letter }}"
        file_system: ntfs
        new_label: "{{ data_label }}"

    # Write the test file once. force: false means later runs never overwrite it
    - name: Write the test file
      ansible.windows.win_copy:
        content: "Windows data disk test file, written by Ansible at {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}\r\n"
        dest: '{{ data_drive_letter }}:\file1.txt'
        force: false

    # Look at the result (read-only commands)
    - name: Show the volume and the file
      ansible.windows.win_shell: |
        Get-Volume -DriveLetter {{ data_drive_letter }} | Format-List DriveLetter, FileSystem, FileSystemLabel, Size
        Get-Content '{{ data_drive_letter }}:\file1.txt'
      register: result
      changed_when: false

    - name: Print the result
      ansible.builtin.debug:
        var: result.stdout_lines